[package]
name = "kernsetzer-import"
description = "Manuscript importers (.docx, Markdown) producing the document model"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Kernsetzer/kernsetzer-import"

readme = "README.md"

[lib]
name = "setzer_import"

[dependencies]
setzer-model = { package = "kernsetzer-model", version = "0.1.3" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
png = "0.18"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
